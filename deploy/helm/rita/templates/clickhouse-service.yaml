apiVersion: v1
kind: Service
metadata:
  name: {{ include "rita.clickhouse.fullname" . }}
  labels:
    {{- include "rita.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  # Headless service so the StatefulSet gets a stable network identity.
  clusterIP: None
  selector:
    {{- include "rita.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
  ports:
    - name: native
      port: {{ .Values.clickhouse.service.nativePort }}
      targetPort: native
    - name: http
      port: {{ .Values.clickhouse.service.httpPort }}
      targetPort: http
