# Pre-commit hooks for RITA.
#   Install: pipx install pre-commit && pre-commit install
#   Run on all files: pre-commit run --all-files
#
# The Go hooks are "local" so they use the toolchain/linter already on your PATH
# (matching CI), rather than a pinned mirror that could drift from .golangci.yml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
        pass_filenames: true

      - id: go-vet
        name: go vet
        entry: bash -c 'go vet ./...'
        language: system
        types: [go]
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'golangci-lint run'
        language: system
        types: [go]
        pass_filenames: false
